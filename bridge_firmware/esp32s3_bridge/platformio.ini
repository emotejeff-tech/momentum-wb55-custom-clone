; ESP32-S3 companion bridge (AI + Wi-Fi telemetry)
; Build:  pio run -e esp32s3
; Flash:  pio run -e esp32s3 -t upload
;
; Wiring to the STM32WB55:
;   ESP32 GPIO17 (TX) -> STM32 PB7 (USART1_RX)
;   ESP32 GPIO18 (RX) <- STM32 PB6 (USART1_TX)
;   GND common, 3.3 V logic only.

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    bblanchon/ArduinoJson@^7.0.0
